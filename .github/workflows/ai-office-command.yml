name: AI Office Command

on:
  workflow_dispatch:
    inputs:
      task:
        description: '업무 지시 내용'
        required: true
        default: '서울 역세권 주거용 오피스텔 시행 사업성 검토'

jobs:
  run-command:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 최신 공식 SDK로 변경
      - name: Install Google GenAI SDK
        run: pip install google-genai

      - name: Run AI Office Command
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OFFICE_TASK: ${{ github.event.inputs.task }}
        run: python scripts/ai_office_command.py
