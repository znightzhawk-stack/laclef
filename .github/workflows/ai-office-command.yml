name: AI Office Command

on:
  workflow_dispatch:
    inputs:
      task:
        description: '업무 지시 내용 (예: 서울 역세권 주거용 오피스텔 부지 매입 타당성 검토)'
        required: true
        default: '서울 역세권 주거용 오피스텔 시행 사업성 검토'

jobs:
  run-command:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google GenAI SDK
        run: pip install google-genai

      - name: Run AI Office Command
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OFFICE_TASK: ${{ github.event.inputs.task }}
        run: python scripts/ai_office_command.py

      - name: Commit and push generated reports and dashboard data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ docs/ index.html
          git diff --staged --quiet || git commit -m "feat: auto-generate developer-grade feasibility report & update dashboard [skip ci]"
          git push

      - name: Commit and Push Reports & Dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html reports/ docs/
          git commit -m "chore: auto-generate executive report and dashboard [skip ci]" || exit 0
          git push
