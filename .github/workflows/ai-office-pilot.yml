```yaml
name: AI Office Pilot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: ai-office-pilot
  cancel-in-progress: false

jobs:
  run-office:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.8-flash
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required files
        run: |
          set -e
          test -f scripts/ai_office_pilot.py
          test -f docs/office-dashboard.html
          test -n "$GEMINI_API_KEY" || {
            echo "ERROR: GEMINI_API_KEY secret is missing."
            exit 1
          }

      - name: Prepare output folders
        run: |
          mkdir -p docs reports tasks

      - name: Run AI Office
        run: python scripts/ai_office_pilot.py

      - name: Validate generated status
        run: |
          set -e
          test -f docs/office-status.json
          python -m json.tool docs/office-status.json > /dev/null
          echo "office-status.json generated and validated."

      - name: Save reports and dashboard status
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/office-status.json
          git add reports/ tasks/

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update AI Office status and reports"
            git push
          fi
```
