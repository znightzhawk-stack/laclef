```yaml
name: Daily AI Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate AI report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY secret is missing."
            exit 1
          fi

          mkdir -p reports
          DATE=$(date -u +%Y-%m-%d)
          KOREA_DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          WEEKDAY=$(TZ=Asia/Seoul date +%A)

          cat > prompt.txt <<PROMPT
          당신은 기업의 기획실장 겸 경영전략 책임자다.
          대표이사가 빠르게 판단하고 실행할 수 있는 한국어 일일 업무보고서를 작성하라.

          기준일:
          - 한국 날짜: ${KOREA_DATE}
          - 요일(영문): ${WEEKDAY}

          [중요한 작성 원칙]
          1. 보고서의 모든 날짜는 기준일에 맞춰 실제 날짜로 작성한다.
          2. 202X년 X월 X일, 날짜 미정, 빈 항목, 미완성 표를 남기지 않는다.
          3. 실제 회사 자료가 제공되지 않았으므로 매출, 실적, 회의 결과, 담당자 이름, 계약 현황을 지어내지 않는다.
          4. 확인된 사실과 일반적인 제안 및 확인 필요 사항을 명확하게 구분한다.
          5. 회사 자료가 없는 내용은 "자료 확인 필요"라고 표시한다.
          6. 추상적인 조언만 나열하지 말고 실무자가 바로 실행할 수 있는 행동으로 작성한다.
          7. 간결하고 전문적인 임원 보고서 문체를 사용한다.

          [보고서 구성]

          # 기획실 일일 종합 업무보고

          보고 일자, 보고 부서, 수신자를 명시한다.
          보고서가 실제 내부 자료가 아닌 일반적인 점검 및 제안 기반임을 표시한다.

          ## 1. 경영진 요약
          - 오늘 우선 점검할 사항 3가지
          - 각 사항의 중요 이유
          - 대표이사의 의사결정이 필요한 사항
          - 내부 자료가 없어 확인하지 못한 사항

          ## 2. 사업개발 및 신규사업
          - 신규 사업의 시장성, 사업성, 수익성, 자금 소요 검토
          - 인허가, 계약, 일정, 사업 리스크 점검
          - 실무자가 수행할 확인 작업과 필요한 자료

          ## 3. 마케팅 및 매출 개선
          - 고객 유입, 문의, 전환율, 계약률 등 점검 지표
          - 마케팅 비용 대비 성과 확인 방법
          - 매출 개선을 위한 실행 과제

          ## 4. 재무 및 리스크 관리
          - 현금흐름, 예산, 고정비 및 미지급 항목 점검
          - 계약, 법무, 인허가, 정보보안 등 주요 리스크
          - 자료가 없으면 실제 재무 상태를 추정하지 말 것

          ## 5. 다음 업무일 우선 실행 과제 5가지
          반드시 정확히 5개를 작성한다.
          각 과제에 다음 항목을 포함한다.
          - 과제명
          - 우선순위 P1~P4
          - 담당 부서 또는 역할
          - 실행 방법
          - 완료 기한: 다음 업무일 기준의 날짜 또는 구체적인 시점
          - 완료 기준 및 기대 결과
          - 선행되어야 할 자료 또는 협조 사항

          담당자의 실명을 만들지 말고 부서 또는 역할로 지정한다.
          실제 일정이나 자료를 모르면 가정 또는 확인 필요 사항임을 명시한다.

          ## 6. 경영진 의사결정 요청
          의사결정이 필요한 사항, 판단에 필요한 자료, 미결정 시 위험을 정리한다.
          실제 요청이 확인되지 않았다면 "현재 제공된 자료 기준으로 확인된 의사결정 요청 없음"이라고 쓴다.

          ## 7. 기획실장 종합 의견
          가장 중요한 실행 우선순위와 후속 점검 방향을 요약한다.

          [최종 검수]
          - 날짜가 기준일과 일치하는가?
          - 5개 실행 과제가 모두 작성되었는가?
          - 담당 역할, 기한, 완료 기준이 있는가?
          - 확인되지 않은 실적이나 사실을 만들어내지 않았는가?
          - 빈 항목이나 예시용 날짜가 남아 있지 않은가?
          PROMPT

          jq -n --rawfile prompt prompt.txt \
            '{contents:[{parts:[{text:$prompt}]}]}' > request.json

          SUCCESS=false

          for attempt in 1 2 3 4; do
            echo "Gemini API attempt $attempt of 4"

            HTTP_CODE=$(curl -sS \
              --connect-timeout 10 \
              --max-time 40 \
              -w "%{http_code}" \
              -o response.json \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              -d @request.json \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent") || HTTP_CODE="000"

            if [ "$HTTP_CODE" = "200" ]; then
              SUCCESS=true
              break
            fi

            echo "Gemini HTTP status: $HTTP_CODE"
            jq '{error: .error}' response.json 2>/dev/null || true

            if [ "$attempt" -lt 4 ]; then
              WAIT=$((attempt * 5))
              echo "Waiting ${WAIT} seconds before retry."
              sleep "$WAIT"
            fi
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "ERROR: Gemini API failed after 4 attempts."
            exit 1
          fi

          REPORT=$(jq -r \
            '[.candidates[0].content.parts[]?.text // empty] | join("\n")' \
            response.json)

          if [ -z "$REPORT" ]; then
            echo "ERROR: AI response was empty or unexpected."
            jq '{error: .error, promptFeedback: .promptFeedback}' response.json
            exit 1
          fi

          {
            echo "# AI 일일 업무보고"
            echo
            echo "- 작성일(한국): $KOREA_DATE"
            echo "- 작성일(UTC): $DATE"
            echo
            printf '%s\n' "$REPORT"
          } > "reports/daily-report-$DATE.md"

          echo "Report generated successfully."

      - name: Save report to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add AI daily work report"
          file_pattern: reports/*.md
