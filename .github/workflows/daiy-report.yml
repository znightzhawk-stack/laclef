
name: Daily AI Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate AI report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY secret is missing."
            exit 1
          fi

          mkdir -p reports
          DATE=$(date -u +%Y-%m-%d)

          cat > prompt.txt <<'PROMPT'
          당신은 기업의 기획실장이다.
          한국어로 실무에 활용할 일일 업무보고서를 작성하라.

          다음 내용을 포함하라.
          1. 경영 핵심 점검사항 3가지
          2. 사업개발 및 신규사업 검토
          3. 마케팅 및 매출 개선 과제
          4. 재무, 비용 및 리스크 점검
          5. 다음 업무일의 우선 실행 과제 5가지
          6. 각 과제의 우선순위, 실행 방법, 기대 결과

          실제 회사 자료는 제공되지 않았다.
          실제 업무, 매출, 실적, 회의 결과를 지어내지 말라.
          일반적인 점검 과제와 제안임을 명확히 구분하라.
          전문적인 임원 보고서 형식으로 작성하라.
          PROMPT

          jq -n --rawfile prompt prompt.txt \
            '{contents:[{parts:[{text:$prompt}]}]}' > request.json

          SUCCESS=false

          for attempt in 1 2 3 4; do
            echo "Gemini API attempt $attempt of 4"

            HTTP_CODE=$(curl -sS \
              --connect-timeout 10 \
              --max-time 30 \
              -w "%{http_code}" \
              -o response.json \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              -d @request.json \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent") || HTTP_CODE="000"

            if [ "$HTTP_CODE" = "200" ]; then
              SUCCESS=true
              break
            fi

            echo "Gemini HTTP status: $HTTP_CODE"
            jq '{error: .error}' response.json 2>/dev/null || true

            if [ "$attempt" -lt 4 ]; then
              sleep $((attempt * 5))
            fi
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "Gemini API failed after 4 attempts."
            exit 1
          fi

          REPORT=$(jq -r \
            '[.candidates[0].content.parts[]?.text // empty] | join("\n")' \
            response.json)

          if [ -z "$REPORT" ]; then
            echo "AI response was empty or unexpected."
            jq '{error: .error, promptFeedback: .promptFeedback}' response.json
            exit 1
          fi

          {
            echo "# AI 일일 업무보고"
            echo
            echo "- 작성일(UTC): $DATE"
            echo
            printf '%s\n' "$REPORT"
          } > "reports/daily-report-$DATE.md"

      - name: Save report to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add AI daily work report"
          file_pattern: reports/*.md
